<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUTINE</title>
    <style>
        /* 화사하고 깨끗한 하늘색(Sky Blue) 파스텔 테마 설정 */
        :root {
            --bg-main: #f0f6fa;       /* 부드러운 파스텔 하늘색 바탕 */
            --bg-card: #ffffff;       /* 깔끔한 화이트 카드 */
            --border-color: #bae6fd;   /* 밝은 하늘색 테두리 선 */
            --text-main: #0c4a6e;      /* 깊고 선명한 딥 블루 글씨 */
            --text-muted: #67e8f9;    /* 밝고 투명한 시안 블루 포인트 */
            --primary: #38bdf8;       /* 산뜻한 하늘색 (핵심 포인트) */
            --primary-hover: #0ea5e9; /* 짙은 하늘색 */
            --accent-bg: #f0f9ff;     /* 맑고 가벼운 얼음물빛 배경색 */
            --today-bg: #0284c7;      /* 오늘 날짜용 스카이 블루 */
        }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; box-sizing: border-box; color: var(--text-main); }
        .container { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); width: 450px; box-shadow: 0 4px 20px rgba(56,189,248,0.12); }
        h1 { font-size: 26px; color: var(--text-main); text-align: center; margin-bottom: 24px; font-weight: 700; letter-spacing: 3px; }
        h2 { font-size: 15px; color: var(--text-main); margin-top: 0; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
        
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-main); font-size: 13px; }
        input, select { width: 100%; padding: 11px 12px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; margin-bottom: 5px; background-color: var(--accent-bg); color: var(--text-main); transition: all 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--primary); background-color: var(--bg-card); box-shadow: 0 0 0 3px rgba(56,189,248,0.25); }
        
        .btn-add { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; margin-bottom: 20px; transition: background-color 0.2s; }
        .btn-add:hover { background-color: var(--primary-hover); }
        
        /* 섹션 구분선 */
        .section { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        /* 미니 달력 디자인 선명하게 최적화 */
        .calendar-container { margin-bottom: 15px; background: var(--accent-bg); padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-header button { background: var(--bg-card); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text-main); font-weight: 600; }
        .calendar-header button:hover { background: var(--border-color); color: #ffffff; }
        .calendar-header h3 { margin: 0; font-size: 14px; color: var(--text-main); font-weight: 700; }
        
        /* 달력 날짜 그리드 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12px; }
        .weekday { font-weight: 600; color: #0284c7; padding-bottom: 4px; }
        .day { padding: 8px 0; border-radius: 6px; cursor: pointer; font-weight: 700; color: var(--text-main); position: relative; border: 1px solid transparent; }
        .day:hover { background: var(--border-color); color: white; }
        
        /* 달력 상태 색상 */
        .day.today { background: var(--today-bg); color: white; }
        .day.selected { border: 2px solid var(--primary); background: var(--bg-card); color: var(--text-main); box-sizing: border-box; }
        .day.today.selected { background: var(--today-bg); color: white; border: 2px solid var(--text-main); }
        
        /* 루틴이 지정된 날 파란 점 찍기 */
        .day.has-task::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--today-bg); border-radius: 50%; }
        .day.today.has-task::after { background: white; }

        ul { list-style: none; padding: 0; margin: 0; }
        li { background: var(--bg-card); padding: 14px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); box-shadow: 0 2px 4px rgba(56,189,248,0.03); }
        
        /* 오늘 해야 할 일 박스 청량한 스카이 블루 매칭 */
        .today-box { border-left: 4px solid var(--primary); background: var(--accent-bg); }
        .today-text { font-weight: 600; color: #0369a1; }
        .btn-check { background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.2s; }
        .btn-check:hover { background: var(--primary); border-color: var(--primary); color: white; }
        .no-task { color: #0369a1; font-size: 13px; text-align: center; padding: 20px 0; background: var(--accent-bg); border-radius: 8px; border: 1px dashed var(--border-color); }
        
        /* 전체 목록 박스 차분하게 세팅 */
        .all-box { border-left: 4px solid #7dd3fc; }
        .routine-period { font-size: 11px; color: #0369a1; display: block; margin-top: 4px; }
        .btn-delete { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px; font-weight: 600; padding: 4px; }
        .btn-delete:hover { text-decoration: underline; color: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <h1>ROUTINE</h1>
    
    <!-- 1. 루틴 등록 폼 -->
    <div class="section">
        <div class="input-group">
            <label for="routineName">새 루틴 이름</label>
            <input type="text" id="routineName" placeholder="예: 분리수거, 영양제 챙겨먹기">
        </div>
        <div class="input-group">
            <label for="routineCycle">반복 주기 종류</label>
            <select id="routineCycle" onchange="toggleCycleInputs()">
                <option value="daily">매일</option>
                <option value="every-2-days">격일 (2일에 한 번)</option>
                <option value="weekly">매주 (7일 주기)</option>
                <option value="every-2-weeks">격주 (14일 주기)</option>
                <option value="custom-days">지정 요일 반복</option>
                <option value="monthly">매달 특정일 반복</option>
                <option value="specific-date">특정 지정 날짜 한 번만</option>
            </select>
        </div>

        <!-- 동적 조건 입력창 영역 (지정 요일) -->
        <div class="input-group" id="inputDaysBox" style="display:none;">
            <label for="routineDays">요일 선택 (쉼표 구분)</label>
            <input type="text" id="routineDays" placeholder="예: 월, 수, 금">
        </div>
        <!-- 동적 조건 입력창 영역 (매달 특정일) -->
        <div class="input-group" id="inputMonthDayBox" style="display:none;">
            <label for="routineMonthDay">매달 며칠날 할까요? (숫자만)</label>
            <input type="number" id="routineMonthDay" min="1" max="31" placeholder="예: 15">
        </div>
        <!-- 동적 조건 입력창 영역 (특정 지정 날짜) -->
        <div class="input-group" id="inputDateBox" style="display:none;">
            <label for="routineSpecificDate">원하는 날짜 선택</label>
            <input type="date" id="routineSpecificDate">
        </div>

        <button class="btn-add" onclick="addRoutine()">루틴 등록하기</button>
    </div>

    <!-- 2. 미니 달력 영역 -->
    <div class="section">
        <div class="calendar-container">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">◀</button>
                <h3 id="calendarTitle"></h3>
                <button onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- 3. 선택한 날짜의 할 일 목록 -->
    <div class="section">
        <h2 id="todaySectionTitle">📋 오늘 해야 할 일</h2>
        <ul id="todayContainer"></ul>
    </div>

    <!-- 4. 등록된 전체 루틴 관리 목록 -->
    <div class="section">
        <h2>📋 전체 루틴 목록</h2>
        <ul id="allContainer"></ul>
    </div>
</div>

<script>
    let routines = JSON.parse(localStorage.getItem('routines')) || [];
    let currentCalDate = new Date();
    let selectedDate = new Date();
    selectedDate.setHours(0,0,0,0);

    function toggleCycleInputs() {
        const cycle = document.getElementById('routineCycle').value;
        document.getElementById('inputDaysBox').style.display = cycle === 'custom-days' ? 'block' : 'none';
        document.getElementById('inputMonthDayBox').style.display = cycle === 'monthly' ? 'block' : 'none';
        document.getElementById('inputDateBox').style.display = cycle === 'specific-date' ? 'block' : 'none';
    }

    function isRoutineOnDate(routine, date) {
        const targetDate = new Date(date);
        targetDate.setHours(0,0,0,0);
        
        const startDay = new Date(routine.startDate);
        startDay.setHours(0,0,0,0);
        
        const diffTime = targetDate - startDay;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const dayOfWeek = ['일', '월', '화', '수', '목', '금', '토'][targetDate.getDay()];
        
        if (diffDays < 0 && routine.cycle !== 'specific-date') return false;

        switch(routine.cycle) {
            case 'daily': return true;
            case 'every-2-days': return diffDays % 2 === 0;
            case 'weekly': return diffDays % 7 === 0;
            case 'every-2-weeks': return diffDays % 14 === 0;
            case 'custom-days': return routine.details.days?.includes(dayOfWeek);
                case 'monthly': return targetDate.getDate() === parseInt(routine.details.monthDay);
case 'specific-date':
if (!routine.details.specificDate) return false;
const sDate = new Date(routine.details.specificDate);
sDate.setHours(0,0,0,0);
return targetDate.getTime() === sDate.getTime();
default: return false;
}
}
function displayRoutines() {
const todayContainer = document.getElementById('todayContainer');
const allContainer = document.getElementById('allContainer');
const todaySectionTitle = document.getElementById('todaySectionTitle');
todayContainer.innerHTML = "";
allContainer.innerHTML = "";
const isSelectedToday = selectedDate.toDateString() === new Date().toDateString();
todaySectionTitle.innerHTML = isSelectedToday ? "📋 오늘 해야 할 일" : 📋 ${selectedDate.getMonth()+1}월 ${selectedDate.getDate()}일의 할 일;
let taskCount = 0;
routines.forEach((routine, index) => {
const liAll = document.createElement('li');
liAll.className = 'all-box';
liAll.innerHTML = <div> <strong>${routine.name}</strong>  <span class="routine-period">🔁 ${routine.cycleText}</span> </div> <button class="btn-delete" onclick="deleteRoutine(${index})">❌ 삭제</button>;
allContainer.appendChild(liAll);
if (isRoutineOnDate(routine, selectedDate)) {
taskCount++;
const liToday = document.createElement('li');
liToday.className = 'today-box';
liToday.innerHTML = <span class="today-text">▪️ ${routine.name}</span> <button class="btn-check" onclick="completeTask('${routine.name}', this)">완료</button>;
todayContainer.appendChild(liToday);
}
});
if (taskCount === 0) {
todayContainer.innerHTML = <div class="no-task">🎉 예정된 루틴이 없습니다! 푹 쉬세요.</div>;
}
renderCalendar();
}
function renderCalendar() {
const year = currentCalDate.getFullYear();
const month = currentCalDate.getMonth();
document.getElementById('calendarTitle').innerText = ${year}년 ${month + 1}월;
const grid = document.getElementById('calendarGrid');
grid.innerHTML = '';
['일','월','화','수','목','금','토'].forEach(w => grid.innerHTML += <div class="weekday">${w}</div>);
const firstDay = new Date(year, month, 1).getDay();
const lastDate = new Date(year, month + 1, 0).getDate();
