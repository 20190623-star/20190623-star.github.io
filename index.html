<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ROUTINE</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style id="dynamicCustomFontStyle"></style>
    <style>
        :root {
            --bg-main: #f0f4f8;       
            --bg-card: #ffffff;       
            --border-color: #bcd2e8;   
            --text-main: #2a4365;      
            --text-muted: #64748b;     
            --primary: #9aa8ca;       
            --primary-hover: #7b8cb6; 
            --accent-bg: #f8fafc;     
            --today-bg: #4a6572;      
            --soft-blue-bg: #e6f0f7;
            --danger: #e06d6d;
            --font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 테마 프리셋 */
        [data-theme="sage"] {
            --bg-main: #f1f5f2;
            --bg-card: #ffffff;
            --border-color: #c5d6c8;
            --text-main: #2d4234;
            --text-muted: #66786b;
            --primary: #8ba892;
            --primary-hover: #708e77;
            --accent-bg: #f7faf8;
            --today-bg: #476350;
            --soft-blue-bg: #e5efe7;
        }

        [data-theme="sand"] {
            --bg-main: #f6f3ee;
            --bg-card: #ffffff;
            --border-color: #dfd5c7;
            --text-main: #4a3f35;
            --text-muted: #7d7065;
            --primary: #b8a38c;
            --primary-hover: #9c866f;
            --accent-bg: #faf8f5;
            --today-bg: #6b5b4b;
            --soft-blue-bg: #efe9e0;
        }

        [data-theme="lavender"] {
            --bg-main: #f4f2f7;
            --bg-card: #ffffff;
            --border-color: #d4cde3;
            --text-main: #3b3252;
            --text-muted: #6e6582;
            --primary: #a396c2;
            --primary-hover: #8678a8;
            --accent-bg: #f9f8fc;
            --today-bg: #584c75;
            --soft-blue-bg: #ece8f5;
        }

        [data-theme="slate"] {
            --bg-main: #eef0f2;
            --bg-card: #ffffff;
            --border-color: #cbd2d9;
            --text-main: #1f2933;
            --text-muted: #616e7c;
            --primary: #7b8794;
            --primary-hover: #52606d;
            --accent-bg: #f8f9fa;
            --today-bg: #323f4b;
            --soft-blue-bg: #e4e7eb;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100dvh;
            font-family: var(--font-family);
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px 48px;
        }

        .app-shell {
            width: 100%;
            max-width: 430px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px 22px 36px;
            box-shadow: 0 8px 24px rgba(30, 41, 59, 0.06);
            transition: max-width 0.3s ease, padding 0.3s ease, border-color 0.25s ease;
        }

        /* 가로(와이드) 레이아웃 모드 */
        body.layout-landscape .app-shell {
            max-width: 920px;
            padding: 32px 32px 38px;
        }

        body.layout-landscape .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            align-items: start;
        }

        body.layout-landscape .col-left .calendar-wrap {
            margin-bottom: 0;
        }

        @media (max-width: 760px) {
            body.layout-landscape .app-shell {
                max-width: 430px;
            }
            body.layout-landscape .main-grid {
                display: block;
            }
            body.layout-landscape .col-left .calendar-wrap {
                margin-bottom: 24px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
                background-color: var(--bg-card);
            }

            .app-shell {
                max-width: 100% !important;
                min-height: 100dvh;
                border: none;
                border-radius: 0;
                box-shadow: none;
                padding-top: calc(20px + env(safe-area-inset-top));
                padding-bottom: calc(36px + env(safe-area-inset-bottom));
                padding-left: 18px;
                padding-right: 18px;
            }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding: 0 2px;
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        header h1 {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text-main);
            margin: 0;
        }

        header .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-settings {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--accent-bg);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.2s ease;
        }

        .btn-settings svg {
            width: 18px;
            height: 18px;
            transition: transform 0.35s ease;
        }

        .btn-settings:hover {
            background: var(--soft-blue-bg);
        }

        .btn-settings:hover svg {
            transform: rotate(45deg);
        }

        .btn-settings:active {
            transform: scale(0.95);
        }

        /* 설정 패널 (모달) */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 18px;
            z-index: 200;
            backdrop-filter: blur(2px);
            overflow-y: auto;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .settings-modal {
            width: 100%;
            max-width: 400px;
            max-height: 90dvh;
            overflow-y: auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 22px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.16);
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-head h3 {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-close-modal {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 6px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group:last-of-type {
            margin-bottom: 22px;
        }

        .setting-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
        }

        .setting-label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 9px;
        }

        .setting-label-row .setting-label {
            margin-bottom: 0;
        }

        /* 달성 이모지 설정 UI */
        .emoji-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .emoji-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            background: var(--accent-bg);
        }

        .emoji-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .emoji-card-head span {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-main);
        }

        .emoji-card-head small {
            font-size: 10.5px;
            color: var(--text-muted);
        }

        .emoji-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .emoji-input {
            width: 52px !important;
            height: 40px !important;
            padding: 0 !important;
            text-align: center;
            font-size: 20px !important;
            border-radius: 10px;
            border: 1.5px solid var(--border-color);
            background: var(--bg-card);
            flex-shrink: 0;
        }

        .emoji-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .emoji-preset-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 7px;
            border: 1px solid #e2e8f0;
            background: var(--bg-card);
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, background-color 0.15s ease;
        }

        .emoji-preset-btn:hover {
            background: var(--soft-blue-bg);
        }

        .emoji-preset-btn:active {
            transform: scale(0.92);
        }

        /* 컬러 선택 버튼 */
        .color-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .color-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 8px 4px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            background: var(--accent-bg);
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.15s ease;
        }

        .color-chip.active {
            border-color: var(--text-main);
            background: var(--soft-blue-bg);
        }

        .swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.12);
        }

        .custom-color-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            background: var(--accent-bg);
            transition: all 0.15s ease;
        }

        .custom-color-bar.active {
            border-color: var(--text-main);
            background: var(--soft-blue-bg);
        }

        .custom-color-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .custom-color-info strong {
            font-size: 12.5px;
            color: var(--text-main);
        }

        .custom-color-info span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .color-picker-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="color"] {
            width: 34px;
            height: 34px;
            padding: 0;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
            background: transparent;
            cursor: pointer;
            overflow: hidden;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        /* 폰트 선택 버튼 */
        .font-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .option-btn {
            height: 40px;
            padding: 0 10px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            background: var(--accent-bg);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .option-btn.active {
            border-color: var(--text-main);
            background: var(--soft-blue-bg);
        }

        .font-upload-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1.5px dashed var(--border-color);
            background: var(--accent-bg);
        }

        .font-upload-box.active {
            border-style: solid;
            border-color: var(--text-main);
            background: var(--soft-blue-bg);
        }

        .font-upload-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .font-upload-text strong {
            font-size: 12.5px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .font-upload-text span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .font-upload-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-mini {
            height: 28px;
            padding: 0 9px;
            border-radius: 7px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-mini:hover {
            background: var(--soft-blue-bg);
        }

        /* 화면 방향 선택 버튼 */
        .layout-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .layout-note {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }

        /* 입력 폼 영역 */
        .composer {
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 22px;
        }

        .field-row {
            margin-bottom: 12px;
        }

        .field-row:last-of-type {
            margin-bottom: 14px;
        }

        .field-split {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 10px;
        }

        label.field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="date"] {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            color: var(--text-main);
            background: var(--bg-card);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        input[type="date"] {
            font-size: 14px;
            padding: 0 10px;
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.65;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(154, 168, 202, 0.22);
        }

        .composer-actions {
            display: flex;
            gap: 8px;
        }

        .btn-primary {
            flex: 1;
            height: 44px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary:active {
            transform: scale(0.985);
        }

        .btn-ghost {
            height: 44px;
            padding: 0 16px;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: none;
        }

        .btn-ghost:active {
            background: var(--soft-blue-bg);
        }

        /* 캘린더 영역 */
        .calendar-wrap {
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 12px;
            margin-bottom: 24px;
        }

        .calendar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 6px;
        }

        .calendar-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .calendar-top h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .btn-today {
            height: 26px;
            padding: 0 9px;
            border-radius: 7px;
            border: 1px solid var(--border-color);
            background: var(--today-bg);
            color: #ffffff;
            font-family: inherit;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s ease, transform 0.1s ease;
            animation: popIn 0.18s ease-out;
        }

        .btn-today.visible {
            display: inline-flex;
        }

        .btn-today:hover {
            opacity: 0.9;
        }

        .btn-today:active {
            transform: scale(0.95);
        }

        .nav-btns {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 9px;
            color: var(--text-main);
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .nav-btn:active {
            background: var(--soft-blue-bg);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .weekday {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            padding-bottom: 6px;
        }

        .day {
            aspect-ratio: 1;
            min-height: 42px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.15s ease;
            position: relative;
        }

        .day:active {
            transform: scale(0.95);
        }

        .day.all-completed {
            background: var(--soft-blue-bg);
            border-color: var(--border-color);
        }

        .day.selected {
            background: var(--bg-main);
            border: 2px solid var(--primary);
        }

        .day.today {
            background: var(--today-bg);
            color: #ffffff;
            border-color: var(--today-bg);
        }

        .day.today.selected {
            border: 2px solid var(--primary);
            box-shadow: inset 0 0 0 1px #ffffff;
        }

        .day-num {
            line-height: 1;
        }

        .task-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2.5px;
            margin-top: 4px;
            height: 12px;
        }

        .task-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--primary);
        }

        .day.today .task-dot {
            background-color: #ffffff;
        }

        .task-badge {
            font-size: 9.5px;
            font-weight: 700;
            color: var(--text-main);
            background: var(--soft-blue-bg);
            padding: 1px 4px;
            border-radius: 5px;
            line-height: 1;
        }

        .day.today .task-badge {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        .plant-icon {
            font-size: 11.5px;
            line-height: 1;
            animation: popIn 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 섹션 공통 */
        .list-section {
            margin-bottom: 24px;
        }

        .list-section:last-child {
            margin-bottom: 0;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 2px;
        }

        .section-title {
            font-size: 15.5px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .section-count {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-hover);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* 오늘 할 일 아이템 */
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: opacity 0.2s ease;
        }

        .task-item:last-child {
            margin-bottom: 0;
        }

        .task-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            word-break: keep-all;
            line-height: 1.35;
        }

        .task-item.completed {
            opacity: 0.55;
        }

        .task-item.completed .task-name {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .check-btn {
            flex-shrink: 0;
            height: 34px;
            padding: 0 14px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .check-btn:active {
            transform: scale(0.96);
        }

        .check-btn.done {
            background: var(--today-bg);
        }

        .empty-state {
            text-align: center;
            padding: 24px 12px;
            font-size: 13.5px;
            color: var(--text-muted);
            background: var(--accent-bg);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
        }

        /* 전체 루틴 아코디언 */
        .accordion-trigger {
            width: 100%;
            min-height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: none;
            border: none;
            padding: 6px 2px;
            cursor: pointer;
            font-family: inherit;
            color: var(--text-main);
        }

        .triangle-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            color: var(--text-muted);
            transition: transform 0.25s ease, color 0.15s ease;
            transform: rotate(180deg);
        }

        .accordion-trigger:hover .triangle-icon {
            color: var(--text-main);
        }

        .triangle-icon.collapsed {
            transform: rotate(0deg);
        }

        .accordion-body {
            max-height: 1400px;
            overflow: hidden;
            transition: max-height 0.28s ease, opacity 0.2s ease, margin-top 0.2s ease;
            opacity: 1;
            margin-top: 10px;
        }

        .accordion-body.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            pointer-events: none;
        }

        .routine-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--text-muted);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .routine-row:last-child {
            margin-bottom: 0;
        }

        .routine-info strong {
            display: block;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .routine-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .row-actions {
            flex-shrink: 0;
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--today-bg);
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .icon-btn:hover {
            background: var(--soft-blue-bg);
        }

        .icon-btn:active {
            transform: scale(0.94);
        }

        .icon-btn.delete {
            color: var(--danger);
        }

        .icon-btn.delete:hover {
            background: #fdf2f2;
        }

        /* 토스트 알림 */
        .toast {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--today-bg);
            color: #ffffff;
            padding: 11px 20px;
            border-radius: 99px;
            font-size: 13.5px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(30, 41, 59, 0.22);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 300;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<script>
    var routines = [];
    try {
        var saved = JSON.parse(localStorage.getItem('routines'));
        if (Array.isArray(saved)) routines = saved;
    } catch (e) {
        routines = [];
    }

    var completedRecords = {};
    try {
        var savedCompleted = JSON.parse(localStorage.getItem('completedRecords'));
        if (savedCompleted && typeof savedCompleted === 'object') completedRecords = savedCompleted;
    } catch (e) {
        completedRecords = {};
    }

    var appPrefs = {
        theme: 'denim',
        customColor: '#7aa2c4',
        font: 'pretendard',
        customFontName: '',
        customFontData: '',
        layout: 'portrait',
        partialEmoji: '🌱',
        completeEmoji: '🌷'
    };
    try {
        var savedPrefs = JSON.parse(localStorage.getItem('routineAppPrefs'));
        if (savedPrefs && typeof savedPrefs === 'object') {
            appPrefs.theme = savedPrefs.theme || 'denim';
            appPrefs.customColor = savedPrefs.customColor || '#7aa2c4';
            appPrefs.font = savedPrefs.font || 'pretendard';
            appPrefs.customFontName = savedPrefs.customFontName || '';
            appPrefs.customFontData = savedPrefs.customFontData || '';
            appPrefs.layout = savedPrefs.layout || 'portrait';
            appPrefs.partialEmoji = savedPrefs.partialEmoji || '🌱';
            appPrefs.completeEmoji = savedPrefs.completeEmoji || '🌷';
        }
    } catch (e) {}

    var fontMap = {
        'pretendard': '"Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        'gowun-dodum': '"Gowun Dodum", "Pretendard", sans-serif',
        'gowun-batang': '"Gowun Batang", Georgia, serif',
        'noto-sans': '"Noto Sans KR", "Pretendard", sans-serif'
    };

    var needSave = false;
    for (var idx = 0; idx < routines.length; idx++) {
        if (routines[idx] && !routines[idx].id) {
            routines[idx].id = 'rt_' + Date.now() + '_' + idx;
            needSave = true;
        }
    }
    if (needSave) localStorage.setItem('routines', JSON.stringify(routines));

    var currentCalDate = new Date();
    var selectedDate = new Date();
    selectedDate.setHours(0, 0, 0, 0);
    var editingIndex = -1;
    var toastTimer = null;

    function hexToHsl(hex) {
        hex = hex.replace(/^#/, '');
        if (hex.length === 3) {
            hex = hex.split('').map(function(c) { return c + c; }).join('');
        }
        var r = parseInt(hex.substring(0, 2), 16) / 255;
        var g = parseInt(hex.substring(2, 4), 16) / 255;
        var b = parseInt(hex.substring(4, 6), 16) / 255;

        var max = Math.max(r, g, b), min = Math.min(r, g, b);
        var h, s, l = (max + min) / 2;

        if (max === min) {
            h = s = 0;
        } else {
            var d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return {
            h: Math.round(h * 360),
            s: Math.round(s * 100),
            l: Math.round(l * 100)
        };
    }

    function applyCustomColorPalette(hex) {
        var hsl = hexToHsl(hex);
        var h = hsl.h;
        var s = Math.min(hsl.s, 65);
        var root = document.documentElement;

        root.style.setProperty('--bg-main', 'hsl(' + h + ', ' + Math.round(s * 0.45) + '%, 95%)');
        root.style.setProperty('--bg-card', '#ffffff');
        root.style.setProperty('--border-color', 'hsl(' + h + ', ' + Math.round(s * 0.55) + '%, 82%)');
        root.style.setProperty('--text-main', 'hsl(' + h + ', ' + Math.round(s * 0.75) + '%, 26%)');
        root.style.setProperty('--text-muted', 'hsl(' + h + ', ' + Math.round(s * 0.25) + '%, 48%)');
        root.style.setProperty('--primary', 'hsl(' + h + ', ' + s + '%, 62%)');
        root.style.setProperty('--primary-hover', 'hsl(' + h + ', ' + s + '%, 52%)');
        root.style.setProperty('--accent-bg', 'hsl(' + h + ', ' + Math.round(s * 0.4) + '%, 98%)');
        root.style.setProperty('--today-bg', 'hsl(' + h + ', ' + Math.round(s * 0.65) + '%, 36%)');
        root.style.setProperty('--soft-blue-bg', 'hsl(' + h + ', ' + Math.round(s * 0.55) + '%, 92%)');
    }

    function clearInlineColorVars() {
        var vars = ['--bg-main', '--bg-card', '--border-color', '--text-main', '--text-muted', '--primary', '--primary-hover', '--accent-bg', '--today-bg', '--soft-blue-bg'];
        for (var i = 0; i < vars.length; i++) {
            document.documentElement.style.removeProperty(vars[i]);
        }
    }

    function applyCustomFontFace(dataUrl) {
        var styleTag = document.getElementById('dynamicCustomFontStyle');
        if (!styleTag) return;
        if (dataUrl) {
            styleTag.textContent = '@font-face { font-family: "UserCustomFont"; src: url("' + dataUrl + '"); font-display: swap; }';
        } else {
            styleTag.textContent = '';
        }
    }

    function applyPreferences() {
        clearInlineColorVars();
        if (appPrefs.theme === 'custom') {
            document.documentElement.removeAttribute('data-theme');
            applyCustomColorPalette(appPrefs.customColor);
        } else if (appPrefs.theme === 'denim') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', appPrefs.theme);
        }

        var picker = document.getElementById('customColorPicker');
        if (picker) picker.value = appPrefs.customColor;

        var customColorBar = document.getElementById('customColorBar');
        if (customColorBar) {
            customColorBar.classList.toggle('active', appPrefs.theme === 'custom');
        }

    function parseAiCycle(text) {
        var rawText = text || '';
        var cleanText = rawText.replace(/\s+/g, '');

        // 연 단위 인식
        var yearIntervalMatch = cleanText.match(/(\d+)년/);
        if (yearIntervalMatch) {
            var yearInterval = parseInt(yearIntervalMatch[1], 10);
            if (yearInterval === 1) {
                return { cycle: 'yearly', text: '매년', details: { yearInterval: 1 }, raw: rawText };
            }
            if (yearInterval > 1) {
                return {
                    cycle: 'yearly',
                    text: yearInterval + '년마다',
                    details: { yearInterval: yearInterval },
                    raw: rawText
                };
            }
        }
        if (cleanText.indexOf('매년') !== -1 || cleanText === '연1회') {
            return { cycle: 'yearly', text: '매년', details: { yearInterval: 1 }, raw: rawText };
        }

        if (cleanText.indexOf('매달') !== -1 || cleanText.indexOf('매월') !== -1) {
            var numStr = cleanText.replace(/[^0-9]/g, '');
            if (numStr) {
                return {
                    cycle: 'monthly',
                    text: '매달 ' + parseInt(numStr, 10) + '일',
                    details: { monthDay: parseInt(numStr, 10) },
                    raw: rawText
                };
            }
        }

        var dayIntervalMatch = cleanText.match(/(\d+)일/);
        if (dayIntervalMatch) {
            var interval = parseInt(dayIntervalMatch[1], 10);
            if (interval === 1) return { cycle: 'daily', text: '매일', details: {}, raw: rawText };
            if (interval > 1) {
                return {
                    cycle: 'every-n-days',
                    text: interval + '일마다',
                    details: { interval: interval },
                    raw: rawText
                };
            }
        }

        var weekIntervalMatch = cleanText.match(/(\d+)주/);
        if (weekIntervalMatch) {
            var weekInterval = parseInt(weekIntervalMatch[1], 10);
            if (weekInterval === 1) return { cycle: 'weekly', text: '매주', details: {}, raw: rawText };
            if (weekInterval > 1) {
                return {
                    cycle: 'every-n-days',
                    text: weekInterval + '주마다',
                    details: { interval: weekInterval * 7 },
                    raw: rawText
                };
            }
        }

        if (cleanText === '매일') return { cycle: 'daily', text: '매일', details: {}, raw: rawText };
        if (cleanText.indexOf('격일') !== -1) return { cycle: 'every-n-days', text: '격일 (2일마다)', details: { interval: 2 }, raw: rawText };
        if (cleanText === '매주') return { cycle: 'weekly', text: '매주', details: {}, raw: rawText };
        if (cleanText.indexOf('격주') !== -1) return { cycle: 'every-n-days', text: '격주 (14일마다)', details: { interval: 14 }, raw: rawText };

        var dayParseTarget = cleanText.replace(/매주|매월|매달|요일/g, '');
        var weekdays = ['일', '월', '화', '수', '목', '금', '토'];
        var detectedDays = [];

        for (var i = 0; i < weekdays.length; i++) {
            if (dayParseTarget.indexOf(weekdays[i]) !== -1) {
                detectedDays.push(weekdays[i]);
            }
        }

        if (detectedDays.length > 0) {
            return {
                cycle: 'custom-days',
                text: '매주 ' + detectedDays.join('·'),
                details: { days: detectedDays },
                raw: rawText
            };
        }

        if (/^\d+$/.test(cleanText)) {
            var numOnly = parseInt(cleanText, 10);
            if (numOnly === 1) return { cycle: 'daily', text: '매일', details: {}, raw: rawText };
            if (numOnly > 1) {
                return {
                    cycle: 'every-n-days',
                    text: numOnly + '일마다',
                    details: { interval: numOnly },
                    raw: rawText
                };
            }
        }

        return { cycle: 'daily', text: '매일', details: {}, raw: rawText };
    }

    function isRoutineOnDate(routine, date) {
        if (!routine) return false;
        var targetDate = new Date(date);
        targetDate.setHours(0, 0, 0, 0);

        var parts = String(routine.startDate || '').split('-');
        var startDay = parts.length === 3
            ? new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10))
            : new Date(routine.startDate || new Date());

        if (isNaN(startDay.getTime())) return false;
        startDay.setHours(0, 0, 0, 0);

        var diffDays = Math.round((targetDate - startDay) / (1000 * 60 * 60 * 24));
        var weekdays = ['일', '월', '화', '수', '목', '금', '토'];
        var dayOfWeek = weekdays[targetDate.getDay()];
        var details = routine.details || {};

        if (diffDays < 0) return false;
        if (routine.cycle === 'daily') return true;
        if (routine.cycle === 'every-2-days') return diffDays % 2 === 0;
        if (routine.cycle === 'weekly') return diffDays % 7 === 0;
        if (routine.cycle === 'every-2-weeks') return diffDays % 14 === 0;

        if (routine.cycle === 'every-n-days') {
            var interval = parseInt(details.interval, 10) || 1;
            return diffDays % interval === 0;
        }

        if (routine.cycle === 'custom-days') {
            if (Array.isArray(details.days)) {
                return details.days.indexOf(dayOfWeek) !== -1;
            }
            return false;
        }
        if (routine.cycle === 'monthly') {
            var mDay = parseInt(details.monthDay, 10);
            return !isNaN(mDay) && targetDate.getDate() === mDay;
        }
        if (routine.cycle === 'yearly') {
            var yInterval = parseInt(details.yearInterval, 10) || 1;
            var yearDiff = targetDate.getFullYear() - startDay.getFullYear();
            if (yearDiff < 0 || yearDiff % yInterval !== 0) return false;

            if (startDay.getMonth() === 1 && startDay.getDate() === 29) {
                var isLeap = (targetDate.getFullYear() % 4 === 0 && targetDate.getFullYear() % 100 !== 0) || (targetDate.getFullYear() % 400 === 0);
                var expectedDay = isLeap ? 29 : 28;
                return targetDate.getMonth() === 1 && targetDate.getDate() === expectedDay;
            }

            return targetDate.getMonth() === startDay.getMonth() && targetDate.getDate() === startDay.getDate();
        }
        return false;
    }

    function displayRoutines() {
        var todayContainer = document.getElementById('todayContainer');
        var allContainer = document.getElementById('allContainer');
        var todaySectionTitle = document.getElementById('todaySectionTitle');
        var todayProgress = document.getElementById('todayProgress');
        if (!todayContainer || !allContainer) return;

        todayContainer.innerHTML = "";
        allContainer.innerHTML = "";

        var isSelectedToday = selectedDate.toDateString() === new Date().toDateString();
        if (todaySectionTitle) {
            todaySectionTitle.innerText = isSelectedToday
                ? "오늘 해야 할 일"
                : (selectedDate.getMonth() + 1) + "월 " + selectedDate.getDate() + "일의 할 일";
        }

        var dateKey = getDateKey(selectedDate);
        var doneList = completedRecords[dateKey] || [];
        var taskCount = 0;
        var doneCount = 0;

        var editIconSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>';
        var deleteIconSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';

        for (var i = 0; i < routines.length; i++) {
            var routine = routines[i];
            if (!routine) continue;

            var liAll = document.createElement('li');
            liAll.className = 'routine-row';
            liAll.innerHTML =
                '<div class="routine-info">' +
                    '<strong>' + (routine.name || '이름 없음') + '</strong>' +
                    '<span class="routine-meta">' + (routine.cycleText || '') + ' · ' + (routine.startDate || '') + ' 시작</span>' +
                '</div>' +
                '<div class="row-actions">' +
                    '<button type="button" class="icon-btn" onclick="editRoutine(' + i + ')" aria-label="루틴 수정" title="수정">' + editIconSvg + '</button>' +
                    '<button type="button" class="icon-btn delete" onclick="deleteRoutine(' + i + ')" aria-label="루틴 삭제" title="삭제">' + deleteIconSvg + '</button>' +
                '</div>';
            allContainer.appendChild(liAll);

            if (isRoutineOnDate(routine, selectedDate)) {
                taskCount++;
                var isDone = doneList.indexOf(routine.id) !== -1;
                if (isDone) doneCount++;

                var liToday = document.createElement('li');
                liToday.className = 'task-item' + (isDone ? ' completed' : '');

                var btnText = isDone ? '완료됨' : '완료';
                var btnClass = isDone ? 'check-btn done' : 'check-btn';

                liToday.innerHTML =
                    '<span class="task-name">' + routine.name + '</span>' +
                    '<button class="' + btnClass + '" onclick="toggleCompleteTask(\'' + routine.id + '\')">' + btnText + '</button>';
                todayContainer.appendChild(liToday);
            }
        }

        if (todayProgress) {
            todayProgress.innerText = taskCount > 0 ? (doneCount + ' / ' + taskCount) : '';
        }

        if (taskCount === 0) {
            todayContainer.innerHTML = '<div class="empty-state">예정된 루틴이 없습니다</div>';
        }

        if (routines.length === 0) {
            allContainer.innerHTML = '<div class="empty-state">등록된 루틴이 없습니다</div>';
        }

        renderCalendar();
    }

    function renderCalendar() {
        var year = currentCalDate.getFullYear();
        var month = currentCalDate.getMonth();
        var titleEl = document.getElementById('calendarTitle');
        if (titleEl) titleEl.innerText = year + "년 " + (month + 1) + "월";

        updateTodayButtonVisibility();

        var grid = document.getElementById('calendarGrid');
        if (!grid) return;
        grid.innerHTML = '';

        var weeks = ['일', '월', '화', '수', '목', '금', '토'];
        for (var i = 0; i < weeks.length; i++) {
            grid.innerHTML += '<div class="weekday">' + weeks[i] + '</div>';
        }

        var firstDay = new Date(year, month, 1).getDay();
        var lastDate = new Date(year, month + 1, 0).getDate();

        for (var i = 0; i < firstDay; i++) {
            grid.innerHTML += '<div></div>';
        }

        var partialEmoji = appPrefs.partialEmoji || '🌱';
        var completeEmoji = appPrefs.completeEmoji || '🌷';

        for (var d = 1; d <= lastDate; d++) {
            var thisDate = new Date(year, month, d);
            thisDate.setHours(0, 0, 0, 0);

            var isToday = thisDate.toDateString() === new Date().toDateString() ? 'today' : '';
            var isSelected = thisDate.getTime() === selectedDate.getTime() ? 'selected' : '';

            var dateKey = getDateKey(thisDate);
            var doneList = completedRecords[dateKey] || [];

            var totalTasks = 0;
            var doneTasks = 0;

            for (var k = 0; k < routines.length; k++) {
                if (isRoutineOnDate(routines[k], thisDate)) {
                    totalTasks++;
                    if (doneList.indexOf(routines[k].id) !== -1) {
                        doneTasks++;
                    }
                }
            }

            var isAllDoneClass = (totalTasks > 0 && doneTasks === totalTasks) ? 'all-completed' : '';
            var indicatorHtml = '<div class="task-indicator">';

            if (totalTasks > 0) {
                if (doneTasks === totalTasks) {
                    indicatorHtml += '<span class="plant-icon" title="모두 달성">' + completeEmoji + '</span>';
                } else if (doneTasks > 0) {
                    indicatorHtml += '<span class="plant-icon" title="' + doneTasks + '/' + totalTasks + ' 달성">' + partialEmoji + '</span>';
                } else if (totalTasks <= 3) {
                    for (var t = 0; t < totalTasks; t++) {
                        indicatorHtml += '<span class="task-dot"></span>';
                    }
                } else {
                    indicatorHtml += '<span class="task-badge">' + totalTasks + '</span>';
                }
            }
            indicatorHtml += '</div>';

            grid.innerHTML +=
                '<div class="day ' + isToday + ' ' + isSelected + ' ' + isAllDoneClass + '" onclick="clickCalDate(' + year + ',' + month + ',' + d + ')">' +
                    '<span class="day-num">' + d + '</span>' +
                    indicatorHtml +
                '</div>';
        }
    }

    function addRoutine() {
        var nameInput = document.getElementById('routineName');
        var startDateInput = document.getElementById('routineStartDate');
        var aiInput = document.getElementById('aiCycleInput');

        if (!nameInput || !startDateInput || !aiInput) return;
        if (nameInput.value.trim() === "") { showToast("루틴 이름을 입력해 주세요"); return; }
        if (!startDateInput.value) { showToast("시작일을 선택해 주세요"); return; }
        if (aiInput.value.trim() === "") { showToast("반복 주기를 입력해 주세요"); return; }

        var parsed = parseAiCycle(aiInput.value);
        routines.push({
            id: 'rt_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
            name: nameInput.value.trim(),
            cycle: parsed.cycle,
            cycleText: parsed.text,
            details: parsed.details,
            startDate: startDateInput.value,
            rawCycleInput: aiInput.value.trim()
        });

        localStorage.setItem('routines', JSON.stringify(routines));
        resetForm();
        displayRoutines();
        showToast("새 루틴이 생성되었습니다");
    }

    function editRoutine(index) {
        var routine = routines[index];
        if (!routine) return;

        editingIndex = index;
        document.getElementById('routineName').value = routine.name;
        document.getElementById('routineStartDate').value = routine.startDate;
        document.getElementById('aiCycleInput').value = routine.rawCycleInput || routine.cycleText;

        document.getElementById('btnSubmit').innerText = "루틴 수정 완료";
        document.getElementById('btnCancel').style.display = "inline-block";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateRoutine() {
        var nameInput = document.getElementById('routineName');
        var startDateInput = document.getElementById('routineStartDate');
        var aiInput = document.getElementById('aiCycleInput');

        if (editingIndex === -1 || !routines[editingIndex]) return;
        if (nameInput.value.trim() === "") { showToast("루틴 이름을 입력해 주세요"); return; }
        if (!startDateInput.value) { showToast("시작일을 선택해 주세요"); return; }
        if (aiInput.value.trim() === "") { showToast("반복 주기를 입력해 주세요"); return; }

        var parsed = parseAiCycle(aiInput.value);
        var existingId = routines[editingIndex].id || ('rt_' + Date.now());
        routines[editingIndex] = {
            id: existingId,
            name: nameInput.value.trim(),
            cycle: parsed.cycle,
            cycleText: parsed.text,
            details: parsed.details,
            startDate: startDateInput.value,
            rawCycleInput: aiInput.value.trim()
        };

        localStorage.setItem('routines', JSON.stringify(routines));
        resetForm();
        displayRoutines();
        showToast("루틴이 수정되었습니다");
    }

    function resetForm() {
        editingIndex = -1;
        var nameInput = document.getElementById('routineName');
        var startDateInput = document.getElementById('routineStartDate');
        var aiInput = document.getElementById('aiCycleInput');

        if (nameInput) nameInput.value = "";
        if (aiInput) aiInput.value = "";

        var now = new Date();
        var yyyy = now.getFullYear();
        var mm = String(now.getMonth() + 1).padStart(2, '0');
        var dd = String(now.getDate()).padStart(2, '0');
        if (startDateInput) startDateInput.value = yyyy + '-' + mm + '-' + dd;

        var btnSubmit = document.getElementById('btnSubmit');
        var btnCancel = document.getElementById('btnCancel');
        if (btnSubmit) btnSubmit.innerText = "루틴 생성";
        if (btnCancel) btnCancel.style.display = "none";
    }

    function deleteRoutine(index) {
        if (confirm("이 루틴을 삭제할까요?")) {
            if (editingIndex === index) {
                resetForm();
            }
            routines.splice(index, 1);
            localStorage.setItem('routines', JSON.stringify(routines));
            displayRoutines();
            showToast("루틴이 삭제되었습니다");
        }
    }

    function toggleCompleteTask(routineId) {
        var dateKey = getDateKey(selectedDate);
        if (!completedRecords[dateKey]) {
            completedRecords[dateKey] = [];
        }

        var idx = completedRecords[dateKey].indexOf(routineId);
        if (idx === -1) {
            completedRecords[dateKey].push(routineId);
            showToast("루틴을 완료했습니다");
        } else {
            completedRecords[dateKey].splice(idx, 1);
        }

        localStorage.setItem('completedRecords', JSON.stringify(completedRecords));
        displayRoutines();
    }
</script>
</body>
</html>
